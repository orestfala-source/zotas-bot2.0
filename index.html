<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zontas Visuals</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #9FE8C9;
      --accent-rgb: 159, 232, 201;
      --bg: #0b0b0d;
      --text: #ECECF1;
      --muted: #8E8E9A;
    }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .card {
      background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      backdrop-filter: blur(14px);
      position: relative; overflow: hidden;
    }
    .spot::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(260px circle at var(--x, 50%) var(--y, 50%), rgba(var(--accent-rgb), .14), transparent 60%);
      transition: opacity .4s ease;
    }
    .spot:hover::before { opacity: 1; }
    .lift { transition: transform .35s ease, border-color .35s ease; }
    .lift:hover { transform: translateY(-3px); border-color: rgba(var(--accent-rgb), .35); }
    .grad-text {
      background: linear-gradient(90deg, var(--accent), #ffffff 90%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .accent { color: var(--accent); }
    .accent-bg { background: var(--accent); }
    .blob {
      position: absolute; border-radius: 9999px; filter: blur(80px);
      opacity: .28; pointer-events: none; animation: float 16s ease-in-out infinite;
      background: var(--accent); transition: background .6s ease;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
    }
    .ticker-track { display: flex; width: max-content; animation: ticker 32s linear infinite; }
    .ticker-track span { white-space: nowrap; padding: 0 1.25rem; color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    @keyframes ticker { to { transform: translateX(-50%); } }
    .btn-accent {
      background: var(--accent); color: #0b0b0d; font-weight: 600;
      transition: all .3s ease;
    }
    .btn-accent:hover:not(:disabled) { box-shadow: 0 0 28px rgba(var(--accent-rgb), .45); transform: translateY(-1px); }
    .btn-accent:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { border: 1px solid rgba(255,255,255,.14); color: var(--text); transition: all .3s ease; }
    .btn-ghost:hover { border-color: rgba(var(--accent-rgb), .6); color: var(--accent); }
    .sel { border-color: var(--accent) !important; box-shadow: 0 0 24px rgba(var(--accent-rgb), .25); }
    .dot {
      width: 18px; height: 18px; border-radius: 999px; cursor: pointer;
      border: 2px solid transparent; transition: transform .25s ease;
    }
    .dot.active { border-color: #fff; transform: scale(1.18); }
    .lang-btn {
      padding: .3rem .6rem; border-radius: 999px; font-size: .72rem; letter-spacing: .05em;
      color: var(--muted); border: 1px solid transparent; transition: all .25s ease;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active { background: var(--accent); color: #0b0b0d; font-weight: 600; }
    .reveal { opacity: 0; transform: translateY(18px); transition: all .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }
    .step-num {
      width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(var(--accent-rgb), .4); color: var(--accent); font-size: .85rem; font-weight: 600;
    }
    details { border-bottom: 1px solid rgba(255,255,255,.07); padding: 1rem 0; }
    details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
    details summary::-webkit-details-marker { display: none; }
    details summary::after { content: '+'; color: var(--accent); font-size: 1.25rem; transition: transform .25s ease; }
    details[open] summary::after { transform: rotate(45deg); }
    details p { color: var(--muted); font-size: .9rem; margin-top: .6rem; line-height: 1.6; }
    .reviews-track { scrollbar-width: none; scroll-behavior: smooth; }
    .reviews-track::-webkit-scrollbar { display: none; }
    .review-card { flex: 0 0 min(300px, 82%); scroll-snap-align: start; }
    .reviews-range { accent-color: var(--accent); cursor: pointer; }
    .toast { animation: up .35s ease; }
    @keyframes up { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.2);
      border-top-color: #0b0b0d; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

let lang = localStorage.getItem('zv_lang') || 'uk';
if (!I18N[lang]) lang = 'uk';
let selectedTariff = TARIFFS[0];
let appliedPromo = null;
let discount = 0;
let lastAnalytics = null;
let keysVisible = false;
let lastReviews = [];
let pickedStars = 0;
const lastMsgs = {};

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0b0b0d'); tg.setBackgroundColor('#0b0b0d'); }

const $ = (id) => document.getElementById(id);
const t = (key) => I18N[lang][key] ?? I18N.en[key] ?? key;
const tf = (key, params = {}) => t(key).replace(/\{(\w+)\}/g, (_, k) => params[k] ?? '');
const fmt = (n) => money(n, currency);
const postJson = (url, body) => fetch(url, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body),
});
const tariffLabel = (id) => t(`tariff${id}`);
const money = (n, cur) => new Intl.NumberFormat(LOCALES[lang], { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(n);
const priceOf = (id) => PRICE_TABLE[currency][id];

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), 2200);
}
function copy(text) {
  navigator.clipboard.writeText(text)
    .then(() => toast(t('copied')))
    .catch(() => toast(t('copy_fail')));
}
function showMsg(id, key, cls, params = {}) {
  lastMsgs[id] = { key, cls, params };
  const el = $(id);
  el.className = `text-xs mt-3 h-4 ${cls}`;
  el.textContent = tf(key, params);
}

  $('tariffs').innerHTML = TARIFFS.map(tr => `
    <button class="card spot lift p-4 text-left ${tr.id === selectedTariff.id ? 'sel' : ''}" data-id="${tr.id}">
      ${tr.id === 90 ? `<span class="absolute top-2 right-2 text-[9px] px-1.5 py-0.5 rounded-full accent-bg text-black font-semibold">${t('popular')}</span>` : ''}
      <div class="text-xs text-neutral-500">${tariffLabel(tr.id)}</div>
      <div class="text-xl font-light mt-2">${money(priceOf(tr.id), currency)}</div>
      ${tr.id === 'beta' ? `<div class="text-[10px] text-neutral-500 mt-1">${t('betaNote')}</div>` : ''}
    </button>`).join('');
  document.querySelectorAll('#tariffs button').forEach(el => el.onclick = () => {
    selectedTariff = TARIFFS.find(x => String(x.id) === el.dataset.id) || selectedTariff;
    renderTariffs(); renderPrice();
  });
}

function renderPrice() {
  const base = priceOf(selectedTariff.id);
  const $final = $('finalPrice'), $old = $('oldPrice');
  $('selectedLabel').textContent = tariffLabel(selectedTariff.id);
  if (discount > 0) {
    $old.textContent = money(base, currency); $old.classList.remove('hidden');
    $final.textContent = money(+(base * (1 - discount / 100)).toFixed(2), currency);
    $final.classList.add('accent');
  } else {
    $old.classList.add('hidden');
    $final.textContent = money(base, currency);
    $final.classList.remove('accent');
  }
}

function renderTicker() {
  const items = t('ticker').split(' · ').map(s => `<span>${s}</span><span>✦</span>`).join('');
  $('ticker').innerHTML = items + items;
}

function renderAnalytics(d) {
  lastAnalytics = d;
  const isAdminRole = d.role === 'admin';
  $('roleBadge').textContent = isAdminRole ? t('adminRoleAdmin') : t('adminRolePromo');
  $('totalCount').textContent = d.total.count;
  $('totalRevenue').textContent = fmt(d.total.revenue);
  const periodIds = [30, 60, 90, 180, 0];
  $('tariffStats').innerHTML = d.total.byTariff.map((row, i) => `
    <div class="card p-3">
      <div class="text-[11px] text-neutral-500">${tariffLabel(periodIds[i])}</div>
      <div class="text-lg font-light mt-1">${row.count}</div>
      <div class="text-[11px] text-neutral-500">${fmt(row.revenue)}</div>
    </div>`).join('');

  const promoCard = (p) => `
    <div class="card p-4 flex justify-between items-center">
      <div class="font-medium">${p.code}
        <span class="text-xs text-neutral-500">${p.discount_percent ? `−${p.discount_percent}%` : ''}${p.owner ? ` · @${p.owner}` : ''}</span>
      </div>
      <div class="text-right">
        <div class="text-sm">${p.count}</div>
        <div class="text-xs text-neutral-400">${fmt(p.revenue)}</div>
      </div>
    </div>`;
  let html = d.promos.map(promoCard).join('');
  if (isAdminRole && d.noPromo) {
    html += promoCard({ code: t('noPromo'), discount_percent: 0, owner: '', count: d.noPromo.count, revenue: d.noPromo.revenue });
  }
  $('promoStats').innerHTML = html || `<p class="text-xs text-neutral-600">${t('noPromos')}</p>`;
  $('adminTools').classList.toggle('hidden', !isAdminRole);
}

function applyLang() {
  document.documentElement.lang = lang;
  const wanted = CURRENCY_BY_LANG[lang];
  currency = PRICE_TABLE[wanted] ? wanted : 'RUB';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  renderTicker();
  renderTariffs();
  renderPrice();
  if (lastAnalytics) loadAnalytics();
  if (keysVisible) loadMyKeys();
  loadReviews();
  Object.entries(lastMsgs).forEach(([id, m]) => showMsg(id, m.key, m.cls, m.params));
}

/* ============ LANG / THEME ============ */
document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  localStorage.setItem('zv_lang', lang);
  applyLang();
});

function setAccent(hex, rgb) {
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-rgb', rgb);
  document.querySelectorAll('.dot').forEach(d => d.classList.toggle('active', d.dataset.color === hex));
  localStorage.setItem('zv_accent', JSON.stringify({ hex, rgb }));
}
document.querySelectorAll('.dot').forEach(d => d.onclick = () => setAccent(d.dataset.color, d.dataset.rgb));

// подсветка карточек за курсором
document.addEventListener('pointermove', (e) => {
  document.querySelectorAll('.spot').forEach(el => {
    const r = el.getBoundingClientRect();
    el.style.setProperty('--x', `${e.clientX - r.left}px`);
    el.style.setProperty('--y', `${e.clientY - r.top}px`);
  });
});

/* ============ PROMO ============ */
$('promoBtn').onclick = async () => {
  const code = $('promoInput').value.trim().toUpperCase();
  if (!code) {
    appliedPromo = null; discount = 0;
    delete lastMsgs.promoMsg; $('promoMsg').textContent = '';
    renderPrice(); return;
  }
  try {
    const res = await postJson(`${API_BASE}/check-promo`, { code });
    const data = await res.json();
    if (data.valid) {
      appliedPromo = data.code;
      discount = data.discount_percent;
      showMsg('promoMsg', 'promo_ok', 'accent', { code: data.code, discount });
    } else {
      appliedPromo = null; discount = 0;
      showMsg('promoMsg', 'promo_invalid', 'text-red-400');
    }
  } catch {
    appliedPromo = null; discount = 0;
    showMsg('promoMsg', 'promo_error', 'text-red-400');
  }
  renderPrice();
};

/* ============ PAYMENT ============ */
$('cryptoBtn').onclick = async () => {
  const btn = $('cryptoBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> ${t('pay_creating')}`;
  try {
    const res = await postJson(`${API_BASE}/create-invoice`, {
      tariffId: selectedTariff.id, promo: appliedPromo, currency, initData: tg?.initData || '',
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('pay_error'));
    if (tg) tg.openTelegramLink(data.pay_url); else window.open(data.pay_url, '_blank');
    pollInvoice(data.invoice_id);
  } catch (e) {
    toast(e.message || t('pay_error'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('payCrypto');
  }
};

function pollInvoice(invoiceId) {
  const started = Date.now();
  const timer = setInterval(async () => {
    if (Date.now() - started > 15 * 60 * 1000) return clearInterval(timer);
    try {
      const res = await fetch(`${API_BASE}/check-invoice?invoice_id=${encodeURIComponent(invoiceId)}`);
      const data = await res.json();
      if (data.status === 'paid' && data.license_key) {
        clearInterval(timer);
        $('keyOutput').textContent = data.license_key;
        $('resultBox').classList.remove('hidden');
        toast(t('paid'));
        loadAnalytics();
        loadMyKeys();
      }
    } catch (_) {}
  }, 5000);
}
$('copyKeyBtn').onclick = () => copy($('keyOutput').textContent);

$('funpayBtn').onclick = () => {
  if (!FUNPAY_URL) return toast(t('funpay_soon'));
  if (tg) tg.openLink(FUNPAY_URL); else window.open(FUNPAY_URL, '_blank');
};

/* ============ ANALYTICS ============ */
async function loadAnalytics() {
  try {
    const res = await postJson(`${API_BASE}/analytics`, { initData: tg?.initData || '', currency });
    if (!res.ok) { $('analyticsPanel').classList.add('hidden'); return; }
    const d = await res.json();
    try { renderAnalytics(d); } catch (e) { console.error('analytics render', e); }
    $('analyticsPanel').classList.remove('hidden');
  } catch {
    $('analyticsPanel').classList.add('hidden');
  }
}

$('adminGenBtn').onclick = async () => {
  try {
    const res = await postJson(`${API_BASE}/admin-generate`, {
      initData: tg?.initData || '', tariffId: selectedTariff.id,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('pay_error'));
    $('adminKeyOutput').textContent = data.key;
    $('adminOutputWrap').classList.remove('hidden');
    toast(t('key_created'));
  } catch (e) { toast(e.message); }
};
$('adminCopyBtn').onclick = () => copy($('adminKeyOutput').textContent);

/* ============ ACTIVATION ============ */
$('activateBtn').onclick = async () => {
  const key = $('activateInput').value.trim().toUpperCase();
  if (!key) return showMsg('activateMsg', 'activate_empty', 'text-red-400');
  try {
    const res = await postJson(`${API_BASE}/activate`, { key });
    const data = await res.json();
    if (data.valid) {
      if (data.forever) showMsg('activateMsg', 'activate_forever', 'accent');
      else showMsg('activateMsg', 'activate_until', 'accent', {
        date: new Date(data.expires_at).toLocaleDateString(LOCALES[lang]),
      });
    } else {
      const map = { not_found: 'reason_not_found', expired: 'reason_expired', no_key: 'activate_empty' };
      showMsg('activateMsg', map[data.reason] || 'activate_error', 'text-red-400');
    }
  } catch {
    showMsg('activateMsg', 'conn_error', 'text-red-400');
  }
};

/* ============ REVEAL ============ */
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

/* ============ MY KEYS ============ */
async function loadMyKeys() {
  try {
    const res = await postJson(`${API_BASE}/my-keys`, { initData: tg?.initData || '' });
    if (!res.ok) { keysVisible = false; $('myKeysSection').classList.add('hidden'); return; }
    const data = await res.json();
    keysVisible = true;
    $('myKeysSection').classList.remove('hidden');
    renderMyKeys(data.keys || []);
  } catch {
    keysVisible = false;
    $('myKeysSection').classList.add('hidden');
  }
}

function renderMyKeys(keys) {
  const list = $('myKeysList');
  if (!keys.length) {
    list.innerHTML = `<p class="text-xs text-neutral-600">${t('myKeysEmpty')}</p>`;
    return;
  }
  list.innerHTML = keys.map(k => {
    let status;
    if (!k.activated_at) status = t('keyNotActivated');
    else if (k.forever) status = t('keyForever');
    else status = tf('keyUntil', { date: new Date(k.expires_at).toLocaleDateString(LOCALES[lang]) });
    return `
      <div class="card p-4">
        <div class="flex items-center justify-between gap-3">
          <code class="font-mono text-sm accent break-all">${k.key}</code>
          <button data-copy="${k.key}" class="px-3 py-1.5 rounded-lg btn-ghost text-xs shrink-0">${t('copy')}</button>
        </div>
        <div class="text-xs text-neutral-500 mt-2">${k.channel === 'beta' ? t('tariffbeta') : tariffLabel(k.tariff_days)} · ${status}</div>
      </div>`;
  }).join('');
  list.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
}

/* ============ REVIEWS ============ */
async function loadReviews() {
  try {
    const res = await fetch(`${API_BASE}/reviews?lang=${encodeURIComponent(lang)}`);
    const data = await res.json();
    lastReviews = data.reviews || [];
  } catch (_) {
    lastReviews = [];
  }
  renderReviews(lastReviews);
}

function renderReviews(list) {
  const track = $('reviewsTrack');
  track.innerHTML = '';
  if (!list.length) {
    track.innerHTML = `<p class="text-sm text-neutral-600 px-2">${t('reviewsEmpty')}</p>`;
    requestAnimationFrame(syncRange);
    return;
  }
  list.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card review-card p-5';
    const stars = document.createElement('div');
    stars.className = 'accent text-sm tracking-widest';
    stars.textContent = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
    const body = document.createElement('p');
    body.className = 'text-sm text-neutral-300 mt-3 leading-relaxed';
    body.textContent = r.text;
    const meta = document.createElement('div');
    meta.className = 'text-xs text-neutral-500 mt-4';
    meta.textContent = `${t('reviewAnon')} · ${new Date(r.created_at).toLocaleDateString(LOCALES[lang])}`;
    card.append(stars, body, meta);
    track.append(card);
  });
  requestAnimationFrame(syncRange);
}

// «Линейка» под лентой: двигает ленту и следит за прокруткой
function syncRange() {
  const track = $('reviewsTrack'), range = $('reviewsRange');
  const max = track.scrollWidth - track.clientWidth;
  range.disabled = max <= 0;
  range.value = max > 0 ? Math.round(track.scrollLeft / max * 100) : 0;
}
$('reviewsRange').addEventListener('input', (e) => {
  const track = $('reviewsTrack');
  const max = track.scrollWidth - track.clientWidth;
  track.scrollLeft = (e.target.value / 100) * max;
});
$('reviewsTrack').addEventListener('scroll', syncRange, { passive: true });

function renderStarPicker() {
  $('starPicker').innerHTML = [1, 2, 3, 4, 5].map(i =>
    `<button type="button" data-star="${i}" class="${i <= pickedStars ? 'accent' : 'text-neutral-600'} transition">★</button>`
  ).join('');
  $('starPicker').querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    pickedStars = +b.dataset.star;
    renderStarPicker();
  });
}

async function loadReviewStatus() {
  const form = $('reviewForm'), thanks = $('reviewThanks');
  try {
    const res = await postJson(`${API_BASE}/review-status`, { initData: tg?.initData || '' });
    if (!res.ok) { form.classList.add('hidden'); thanks.classList.add('hidden'); return; }
    const d = await res.json();
    form.classList.toggle('hidden', !(d.bought && !d.reviewed));
    thanks.classList.toggle('hidden', !d.reviewed);
  } catch {
    form.classList.add('hidden'); thanks.classList.add('hidden');
  }
}

$('reviewSend').onclick = async () => {
  const text = $('reviewText').value.trim();
  if (!pickedStars) return showMsg('reviewMsg', 'reviewErrStars', 'text-red-400');
  if (text.length < 3 || text.length > 500) return showMsg('reviewMsg', 'reviewErrShort', 'text-red-400');
  const btn = $('reviewSend');
  btn.disabled = true;
  try {
    const res = await postJson(`${API_BASE}/reviews`, { initData: tg?.initData || '', stars: pickedStars, text });
    const data = await res.json();
    if (res.ok && data.ok) {
      $('reviewForm').classList.add('hidden');
      $('reviewThanks').classList.remove('hidden');
      loadReviews();
    } else {
      const map = { already: 'reviewAlready', not_buyer: 'reviewNotBuyer', bad_stars: 'reviewErrStars', bad_text: 'reviewErrShort' };
      showMsg('reviewMsg', map[data.reason] || 'activate_error', 'text-red-400');
    }
  } catch {
    showMsg('reviewMsg', 'conn_error', 'text-red-400');
  } finally {
    btn.disabled = false;
  }
};

/* ============ LAUNCHER DOWNLOAD ============ */
$('launcherBtn').onclick = async () => {
  const btn = $('launcherBtn');
  btn.disabled = true;
  try {
    const res = await postJson(`${API_BASE}/download`, { initData: tg?.initData || '' });
    const data = await res.json();
    if (!res.ok) {
      showMsg('launcherMsg', data.reason === 'no_license' ? 'launcherNoAccess' : 'launcherErr', 'text-red-400');
      return;
    }
    if (tg) tg.openLink(data.url); else window.open(data.url, '_blank');
    showMsg('launcherMsg', 'launcherReady', 'accent');
  } catch {
    showMsg('launcherMsg', 'conn_error', 'text-red-400');
  } finally {
    btn.disabled = false;
  }
};

/* ============ PRICES ============ */
async function loadPrices() {
  try {
    const res = await fetch(`${API_BASE}/prices`);
    const data = await res.json();
    if (data.prices) PRICE_TABLE = data.prices;
    if (data.currencies) CURRENCY_BY_LANG = data.currencies;
  } catch (_) {}
}

/* ============ INIT ============ */
(function init() {
  const saved = JSON.parse(localStorage.getItem('zv_accent') || 'null');
  if (saved) setAccent(saved.hex, saved.rgb);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  loadAnalytics();
  loadMyKeys();
  loadReviews();
  loadReviewStatus();
  renderStarPicker();
  loadPrices().finally(() => { try { applyLang(); } catch (e) { console.error(e); } });
})();
</script>
</body>
</html>
